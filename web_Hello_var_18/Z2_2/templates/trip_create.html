<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Рейсы</title></head>
<body>
    <form method="POST" action="">
        {% csrf_token %}
        <p>Маршрут:
            <select name="route">
                {% for route in routes %}
                <option value="{{ route.id }}">{{ route.number }} ({{ route.from_city }}-{{ route.to_city }})</option>
                {% endfor %}
            </select>
        </p>
        <p>Время (текст): <input type="text" name="departure_time" required></p>
        <p>Автобус: <input type="text" name="bus_name" required></p>
        <input type="submit" value="Сохранить">
    </form>

    <h2>Список рейсов :</h2>
    <p><a href="/">← Назад к маршрутам</a></p>

    <table cellspacing="10">
        <tr>
            <th align="left">Id</th><th align="left">Маршрут</th><th align="left">Время</th><th align="left">Автобус</th>
        </tr>
        {% for trip in trips %}
        <tr>
            <td>{{ trip.id }}</td>
            <td>{{ trip.route.number }}</td>
            <td>{{ trip.departure_time }}</td>
            <td>{{ trip.bus_name }}</td>
            <td>
                <a href="/trips/edit/{{ trip.id }}/">Изменить</a> |
                <a href="/trips/delete/{{ trip.id }}/">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
