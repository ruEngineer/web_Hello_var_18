<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Рейсы</title></head>
<body>
    <h2>Добавить рейс</h2>
    <p><a href="/">← На главную (к билетам)</a></p>
    <form method="POST" action="">
        {% csrf_token %}
        <p>Название рейса: <input type="text" name="name" placeholder="101 Москва-Тверь" required></p>
        <p>Цена: <input type="number" name="price" required></p>
        <input type="submit" value="Сохранить">
    </form>

    <h2>Список рейсов :</h2>
    <table cellspacing="10">
        <tr><th align="left">Id</th><th align="left">Название</th><th align="left">Цена</th><th></th></tr>
        {% for t in trips %}
        <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.name }}</td>
            <td>{{ t.price }} ₽</td>
            <td><a href="/trips/delete/{{ t.id }}/">Удалить</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
