<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование автобуса</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <p>
            <label>Название автобуса:</label><br>
            <input type="text" name="name" value="{{ bus.name }}" required/>
        </p>
        <p>
            <label>Мест в автобусе:</label><br>
            <input type="number" name="mest" value="{{ bus.mest }}" required/>
        </p>
        <input type="submit" value="Сохранить">
    </form>
    <br>
    <a href="/">Вернуться к списку</a>
</body>
</html>
