<p>
</p>
<table>
    <thead>
        <th>№</th>
        <th>Маршрут</th>
        <th>Отправление</th>
        <th>В пути</th>
        <th>Автобус</th>
        <th>Цена</th>
        <th></th>
    </thead>
    {% for r in routes %}
    <tr>
        <td><a href="{% url 'route_detail' r.number %}">{{ r.number }}</a></td>
        <td>{{ r.from_city }} → {{ r.to_city }}</td>
        <td>{{ r.departure }}</td>
        <td>{{ r.duration }} ч</td>
        <td>{{ r.bus }}</td>
        <td>{{ r.price }} ₽</td>
        <td><a href="{% url 'order_new' %}?route={{ r.number }}">Купить</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="7">Рейсов не найдено</td></tr>
    {% endfor %}
</table>
